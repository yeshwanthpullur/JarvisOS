general:
  app_name: JARVIS OS
  environment: development
  debug: false

logging:
  level: INFO
  log_dir: logs
  log_file: jarvis-os.log
  max_bytes: 1048576
  backup_count: 5

memory:
  enabled: true
  storage_dir: memory
  task_store_dir: data/tasks
  vector_index_dir: data/vector-indexes

brain:
  enabled: true
  vault_path: data/obsidian-vault
  vault_name: Jarvis Brain
  auto_create_vault: true
  daily_note_format: "%Y-%m-%d"

models:
  default_model: "llama3.2:1b"
  fallback_model: ""
  allow_local_models: true

providers:
  default_provider: "ollama"
  enabled_providers:
    - "ollama"
  timeout_seconds: 60
  max_retries: 1
  track_costs: false
  definitions:
    openai:
      kind: "openai"
      enabled: false
      local_only: false
      base_url: "https://api.openai.com"
      api_key_env: "OPENAI_API_KEY"
      metadata:
        provider_family: "openai"

    anthropic:
      kind: "anthropic"
      enabled: false
      local_only: false
      base_url: "https://api.anthropic.com"
      api_key_env: "ANTHROPIC_API_KEY"
      metadata:
        provider_family: "anthropic"

    google:
      kind: "google_gemini"
      enabled: false
      local_only: false
      base_url: "https://generativelanguage.googleapis.com"
      api_key_env: "GOOGLE_API_KEY"
      metadata:
        provider_family: "gemini"

    deepseek:
      kind: "deepseek"
      enabled: false
      local_only: false
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
      metadata:
        provider_family: "deepseek"

    mistral:
      kind: "mistral"
      enabled: false
      local_only: false
      base_url: "https://api.mistral.ai"
      api_key_env: "MISTRAL_API_KEY"
      metadata:
        provider_family: "mistral"

    groq:
      kind: "groq"
      enabled: false
      local_only: false
      base_url: "https://api.groq.com"
      api_key_env: "GROQ_API_KEY"
      metadata:
        provider_family: "groq"

    openrouter:
      kind: "openrouter"
      enabled: false
      local_only: false
      base_url: "https://openrouter.ai/api"
      api_key_env: "OPENROUTER_API_KEY"
      metadata:
        provider_family: "openrouter"

    zenmux:
      kind: "zenmux"
      enabled: true
      local_only: false
      base_url: "https://api.zenmux.ai"
      api_key_env: "ZENMUX_API_KEY"
      metadata:
        provider_family: "zenmux"

    local:
      kind: "local"
      enabled: false
      local_only: true
      base_url: "http://127.0.0.1:11434"
      metadata:
        local: true
        runtime: "openai-compatible"

    ollama:
      kind: "ollama"
      enabled: true
      local_only: true
      base_url: "http://127.0.0.1:11434"
      preferred_model: "llama3.2:1b"
      default_model: "llama3.2:1b"
      timeout_seconds: 60
      max_retries: 1
      metadata:
        local: true
        runtime: "ollama"

agents:
  enabled: true
  max_concurrent_agents: 4
  workspace_dir: data/agent-workspaces
  max_agents_per_coordination: 4
  max_subtasks_per_coordination: 8
  max_recursion_depth: 1
  max_retries_per_subtask: 1
  max_total_timeout_seconds: 180

tools:
  maximum_per_request: 3
  maximum_per_coordination: 6
  maximum_retries: 1
  maximum_timeout_seconds: 30
  maximum_concurrent: 2
  maximum_output_bytes: 64000
  maximum_argument_bytes: 16000
  maximum_chained_depth: 1
  maximum_dry_run_seconds: 5
  maximum_history: 200

planning:
  maximum_steps: 12
  maximum_milestones: 5
  maximum_alternatives: 3
  maximum_dependencies_per_step: 4
  maximum_plan_depth: 2
  maximum_retries: 1
  maximum_replans: 3
  maximum_concurrent: 2
  maximum_agents: 3
  maximum_tools: 4
  maximum_timeout_seconds: 90
  maximum_versions: 10
  maximum_output_bytes: 100000
  maximum_assumptions: 8

voice:
  enabled: false
  mode: "off"
  language: en-US
  local_only: true
  privacy_mode: standard
  input_enabled: false
  output_enabled: false
  input_backend: offline-stt
  output_backend: windows-sapi
  input_device:
  output_device:
  confidence_threshold: 0.75
  confirmation_threshold: 0.60
  max_capture_seconds: 30
  silence_timeout_seconds: 3
  max_audio_size: 20000000
  max_transcript_length: 4000
  max_spoken_response_length: 500
  rate: 0
  volume: 100
  raw_audio_persistence: false
  retention_limit: 0
  temp_audio_lifetime_seconds: 300
  stt_model_path:
  stt_executable:
  wake_word_enabled: false
  wake_word_backend:
  activation_phrase: jarvis
  interruption_enabled: true
  temp_directory: data/voice-temp
  allowed_audio_directories: [data/voice-input]

vision:
  enabled: true
  local_only: true
  privacy_mode: standard
  max_image_size: 20000000
  timeout_seconds: 60
  allowed_directories: []

sync:
  enabled: false
  mode: "off"
  adapter: local-queue
  automatic_sync: false
  remote_endpoint: null
  maximum_item_size: 8192
  maximum_queue_items: 100
  maximum_batch_size: 10
  maximum_attempts: 3
  completed_retention_count: 25
  audit_retention_count: 100
  maximum_nested_depth: 4
  maximum_string_length: 1000
  conflict_strategy: manual
  encryption_required: true
  sync_raw_audio: false
  sync_raw_images: false
  sync_raw_documents: false
  sync_conversations: false
  sync_secrets: false

web_automation:
  enabled: true
  mode: "read_only"
  adapter: read-only-http
  allow_local_targets: false
  allow_http: false
  audit_retention: 100
  action_timeout_seconds: 8
  maximum_redirects: 5
  maximum_response_bytes: 524288
  maximum_preview_characters: 2000
  store_page_content: false
  store_screenshots: false

interface:
  enabled: false
  host: 127.0.0.1
  port: 8765
  open_browser: true
  theme: system
  default_view: chat
  event_transport: sse
  max_request_size: 65536
  max_response_size: 262144
  max_log_entries: 200
  max_activity_entries: 200
  max_history_messages: 200
  request_timeout: 120
  event_timeout: 30
  allow_remote: false
  allowed_origins: [http://127.0.0.1:8765, http://localhost:8765]
  session_token_lifetime: 14400
  safe_markdown: true
  show_provider_metadata: true
  show_activity_panel: true
  compact_mode: false

plugins:
  enabled: true
  plugin_dir: plugins
  allow_user_plugins: false
  auto_discover: true
  auto_enable: true
  compatibility_version: "0.1"

downloads:
  download_dir: data/downloads
  max_concurrent_downloads: 3
  verify_integrity: true

automation:
  enabled: false
  queue_dir: data/automation-queue
  max_concurrent_jobs: 2

security:
  secrets_dir: data/secrets
  allow_shell_execution: false
  allow_network_access: true
  require_confirmation_for_installers: true

desktop:
  enabled: true
  platform: windows
  downloads_folder: ""

mobile:
  enabled: false
  api_enabled: false
