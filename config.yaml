general:
  app_name: JARVIS OS
  environment: development
  debug: false

logging:
  level: INFO
  log_dir: logs
  log_file: jarvis-os.log
  max_bytes: 1048576
  backup_count: 5

memory:
  enabled: true
  storage_dir: memory
  task_store_dir: data/tasks
  vector_index_dir: data/vector-indexes

conversation:
  enabled: true
  max_turns: 12
  max_topics: 6
  summary_threshold: 8
  reference_resolution: true
  clarification_enabled: true
  max_context_chars: 6000

brain:
  enabled: true
  vault_path: data/obsidian-vault
  vault_name: Jarvis Brain
  auto_create_vault: true
  daily_note_format: "%Y-%m-%d"

models:
  default_model: "llama3.2:1b"
  fallback_model: ""
  allow_local_models: true
  runtime_enabled: true
  runtime_default_policy: local_preferred
  runtime_prefer_local: true
  runtime_allow_remote: false
  runtime_allow_paid: false
  runtime_allow_auto_start: false
  runtime_allow_auto_download: false
  runtime_max_concurrent: 2
  runtime_default_timeout_seconds: 60
  runtime_health_cache_seconds: 60
  runtime_max_fallbacks: 2
  runtime_resource_reserve_ratio: 0.2
  runtime_save_history: true
  runtime_redact_sensitive_values: true

providers:
  default_provider: "ollama"
  enabled_providers:
    - "ollama"
  timeout_seconds: 60
  max_retries: 1
  track_costs: false
  definitions:
    openai:
      kind: "openai"
      enabled: false
      local_only: false
      base_url: "https://api.openai.com"
      api_key_env: "OPENAI_API_KEY"
      metadata:
        provider_family: "openai"

    anthropic:
      kind: "anthropic"
      enabled: false
      local_only: false
      base_url: "https://api.anthropic.com"
      api_key_env: "ANTHROPIC_API_KEY"
      metadata:
        provider_family: "anthropic"

    google:
      kind: "google_gemini"
      enabled: false
      local_only: false
      base_url: "https://generativelanguage.googleapis.com"
      api_key_env: "GOOGLE_API_KEY"
      metadata:
        provider_family: "gemini"

    deepseek:
      kind: "deepseek"
      enabled: false
      local_only: false
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
      metadata:
        provider_family: "deepseek"

    mistral:
      kind: "mistral"
      enabled: false
      local_only: false
      base_url: "https://api.mistral.ai"
      api_key_env: "MISTRAL_API_KEY"
      metadata:
        provider_family: "mistral"

    groq:
      kind: "groq"
      enabled: false
      local_only: false
      base_url: "https://api.groq.com"
      api_key_env: "GROQ_API_KEY"
      metadata:
        provider_family: "groq"

    openrouter:
      kind: "openrouter"
      enabled: false
      local_only: false
      base_url: "https://openrouter.ai/api"
      api_key_env: "OPENROUTER_API_KEY"
      metadata:
        provider_family: "openrouter"

    zenmux:
      kind: "zenmux"
      enabled: true
      local_only: false
      base_url: "https://api.zenmux.ai"
      api_key_env: "ZENMUX_API_KEY"
      metadata:
        provider_family: "zenmux"

    local:
      kind: "local"
      enabled: false
      local_only: true
      base_url: "http://127.0.0.1:11434"
      metadata:
        local: true
        runtime: "openai-compatible"

    ollama:
      kind: "ollama"
      enabled: true
      local_only: true
      base_url: "http://127.0.0.1:11434"
      preferred_model: "llama3.2:1b"
      default_model: "llama3.2:1b"
      timeout_seconds: 60
      max_retries: 1
      metadata:
        local: true
        runtime: "ollama"

agents:
  enabled: true
  max_concurrent_agents: 4
  workspace_dir: data/agent-workspaces
  max_agents_per_coordination: 4
  max_subtasks_per_coordination: 8
  max_recursion_depth: 1
  max_retries_per_subtask: 1
  max_total_timeout_seconds: 180

tools:
  maximum_per_request: 3
  maximum_per_coordination: 6
  maximum_retries: 1
  maximum_timeout_seconds: 30
  maximum_concurrent: 2
  maximum_output_bytes: 64000
  maximum_argument_bytes: 16000
  maximum_chained_depth: 1
  maximum_dry_run_seconds: 5
  maximum_history: 200

planning:
  maximum_steps: 12
  maximum_milestones: 5
  maximum_alternatives: 3
  maximum_dependencies_per_step: 4
  maximum_plan_depth: 2
  maximum_retries: 1
  maximum_replans: 3
  maximum_concurrent: 2
  maximum_agents: 3
  maximum_tools: 4
  maximum_timeout_seconds: 90
  maximum_versions: 10
  maximum_output_bytes: 100000
  maximum_assumptions: 8

voice:
  enabled: false
  mode: "off"
  language: en-US
  local_only: true
  privacy_mode: standard
  input_enabled: false
  output_enabled: false
  input_backend: offline-stt
  output_backend: windows-sapi
  input_device:
  output_device:
  confidence_threshold: 0.75
  confirmation_threshold: 0.60
  max_capture_seconds: 30
  silence_timeout_seconds: 3
  max_audio_size: 20000000
  max_transcript_length: 4000
  max_spoken_response_length: 500
  rate: 0
  volume: 100
  raw_audio_persistence: false
  retention_limit: 0
  temp_audio_lifetime_seconds: 300
  voice_input_audit_retention: 50
  stt_model_path:
  stt_executable:
  wake_word_enabled: false
  wake_word_backend:
  activation_phrase: jarvis
  interruption_enabled: true
  temp_directory: data/voice-temp
  allowed_audio_directories: [data/voice-input]

vision:
  enabled: true
  local_only: true
  privacy_mode: standard
  provider: ollama
  model: llava
  ollama_host: http://127.0.0.1:11434
  max_image_size: 20000000
  timeout_seconds: 60
  audit_enabled: true
  audit_retention: 100
  store_image_content: false
  allowed_directories: []

sync:
  enabled: false
  mode: "off"
  adapter: local-queue
  automatic_sync: false
  remote_endpoint: null
  maximum_item_size: 8192
  maximum_queue_items: 100
  maximum_batch_size: 10
  maximum_attempts: 3
  completed_retention_count: 25
  audit_retention_count: 100
  maximum_nested_depth: 4
  maximum_string_length: 1000
  conflict_strategy: manual
  encryption_required: true
  sync_raw_audio: false
  sync_raw_images: false
  sync_raw_documents: false
  sync_conversations: false
  sync_secrets: false

workflow:
  enabled: true
  max_active: 4
  max_parallel_steps: 2
  max_pending: 25
  default_timeout_seconds: 300
  max_retry_count: 2
  default_checkpoint_interval: 1
  enable_parallel_execution: true
  enable_pause_resume: true
  enable_recovery: true
  enable_metrics: true
  enable_audit: true
  max_event_history: 200
  max_checkpoint_history: 50
  max_artifacts: 50
  max_runtime_hours: 4

web_automation:
  enabled: true
  mode: "read_only"
  adapter: read-only-http
  allow_local_targets: false
  allow_http: false
  audit_retention: 100
  action_timeout_seconds: 8
  maximum_redirects: 5
  maximum_response_bytes: 524288
  maximum_preview_characters: 2000
  store_page_content: false
  store_screenshots: false

interface:
  enabled: false
  host: 127.0.0.1
  port: 8765
  open_browser: true
  theme: system
  default_view: chat
  event_transport: sse
  max_request_size: 65536
  max_response_size: 262144
  max_log_entries: 200
  max_activity_entries: 200
  max_history_messages: 200
  request_timeout: 120
  event_timeout: 30
  allow_remote: false
  allowed_origins: [http://127.0.0.1:8765, http://localhost:8765]
  session_token_lifetime: 14400
  safe_markdown: true
  show_provider_metadata: true
  show_activity_panel: true
  compact_mode: false

plugins:
  enabled: true
  plugin_dir: plugins
  allow_user_plugins: false
  auto_discover: false
  auto_enable: false
  compatibility_version: "0.1"
  allow_external: true
  allow_local_development: true
  allow_inprocess_external: false
  allow_subprocess: false
  allow_network: false
  allow_filesystem_write: false
  allow_installation: false
  allow_updates: false
  allow_uninstall: false
  require_integrity_check: true
  require_approval_for_enable: true
  require_approval_for_side_effects: true
  max_registered: 64
  max_enabled: 8
  max_output_chars: 8000
  execution_timeout_seconds: 30
  max_concurrent: 1
  save_history: true
  max_history_items: 100
  redact_sensitive_values: true

downloads:
  download_dir: data/downloads
  max_concurrent_downloads: 3
  verify_integrity: true

automation:
  enabled: false
  queue_dir: data/automation-queue
  max_concurrent_jobs: 2

security:
  secrets_dir: data/secrets
  allow_shell_execution: false
  allow_network_access: true
  require_confirmation_for_installers: true

desktop:
  enabled: true
  platform: windows
  downloads_folder: ""

mobile:
  enabled: false
  api_enabled: false
  automation_enabled: true
  automation_mode: planning_only
  automation_adapter: planning-only
  audit_retention: 100
  live_control_enabled: false
  store_private_data: false

documents:
  enabled: true
  default_mode: plan_only
  allow_pdf: false
  allow_office: false
  allow_ocr: false
  allow_cloud_parsing: false
  allow_bulk_ingestion: false
  store_extracted_content: false

browser:
  enabled: true
  default_mode: read_only
  allow_interactive: false
  allow_login: false
  allow_forms: false
  allow_purchases: false
  allow_downloads: false
  allow_cookies: false
  allow_sessions: false

scheduler:
  enabled: true
  default_mode: plan_only
  allow_background_runner: false
  allow_os_cron: false
  allow_task_scheduler: false
  allow_notifications: false
  minimum_cadence_minutes: 60

communication:
  enabled: true
  default_mode: draft_only
  allow_sending: false
  allow_external_providers: false
  allow_contact_access: false
  allow_bulk_messages: false
  allow_credentials_access: false
  external_enabled: true
  external_require_approval: true
  external_allow_attachments: false
  external_allow_scheduled_send: false
  external_max_message_chars: 4000
  external_max_attachments: 0
  external_max_sends_per_window: 3
  external_rate_window_seconds: 60
  external_max_retries: 1
  external_duplicate_protection: true
  external_redact_sensitive_values: true
  external_block_secrets: true

adapters:
  enabled: true
  default_mode: plan_only
  allow_mcp_runtime: false
  allow_plugin_install: false
  allow_external_tool_execution: false
  allow_network_connectors: false
  allow_credentials_access: false
  allow_background_servers: false

models_advanced:
  enabled: true
  default_mode: planning_only
  local_first: true
  allow_cloud_providers: false
  allow_provider_install: false
  allow_model_download: false
  allow_runtime_start: false
  allow_docker: false
  allow_credentials_access: false

evaluation:
  enabled: true
  default_mode: local_only
  allow_cloud_telemetry: false
  allow_remote_logging: false
  allow_background_runner: false
  fail_on_truthfulness_mismatch: true
  fail_on_secret_leakage: true
  fail_on_path_leakage: true

external_integrations:
  enabled: true
  default_mode: metadata_only
  allow_remote_providers: false
  allow_paid_providers: false
  allow_external_execution: false
  require_approval_for_external_actions: true
  block_secret_egress: true
  max_providers: 32
  max_history_items: 50
  health_cache_seconds: 60
  max_retries: 1

external_provider_flags:
  telegram_enabled: false
  discord_enabled: false
  email_smtp_enabled: false
  email_api_enabled: false
  slack_enabled: false
  matrix_enabled: false
  whatsapp_enabled: false
  github_enabled: false
  mcp_local_enabled: false
  mcp_remote_enabled: false
  external_plugins_enabled: false
  nvidia_nim_enabled: false
  openai_compatible_enabled: false
telegram:
  enabled: false
  transport: long_polling
  polling_enabled: false
  webhook_enabled: false
  require_authorized_chat: true
  allow_inbound_text: true
  allow_outbound_text: true
  allow_commands: true
  allow_media: false
  allow_documents: false
  allow_voice: false
  allow_group_chats: false
  allow_channel_posts: false
  allow_scheduled_send: false
  require_approval_for_send: true
  max_message_chars: 3900
  max_updates_per_poll: 20
  poll_timeout_seconds: 10
  max_retries: 2
  rate_limit_window: 60
  max_sends_per_window: 5
  save_history: true
  redact_sensitive_values: true
discord:
  enabled: false
  transport: bot_api
  allow_send: false
  allow_inbound: false
  allow_webhook: false
  allow_attachments: false
  require_approval: true
  max_message_chars: 1900
  max_sends_per_window: 3
  max_retries: 1
email_connector:
  smtp_enabled: false
  api_enabled: false
  allow_send: false
  allow_read: false
  allow_html: false
  allow_attachments: false
  allow_cc: false
  allow_bcc: false
  allow_bulk: false
  require_approval: true
  max_recipients: 1
  max_body_chars: 10000
  max_retries: 1
slack:
  enabled: false
  allow_send: false
  allow_inbound: false
  allow_attachments: false
  require_approval: true
  max_message_chars: 3900
  max_sends_per_window: 3
  max_retries: 1
github_provider:
  enabled: false
  transport: gh_cli
  allow_read: true
  allow_issue_write: false
  allow_pr_write: false
  allow_release_write: false
  allow_merge: false
  allow_workflow_execute: false
  allow_admin: false
  allowed_repositories: [yeshwanthpullur/JarvisOS]
  require_approval_for_writes: true
  max_results: 20
  max_body_chars: 4000
  max_retries: 1
  health_cache_seconds: 60
  save_history: true
  redact_sensitive_values: true

mcp:
  enabled: true
  allow_local_stdio: true
  allow_local_http: true
  allow_remote_http: false
  allow_tool_execution: false
  allow_resource_read: true
  allow_prompts: false
  allow_installation: false
  allow_scheduled_execution: false
  require_approval_for_side_effects: true
  max_servers: 16
  max_tools_per_server: 50
  max_resources_per_server: 50
  max_result_chars: 8000
  max_concurrent_calls: 2
  startup_timeout_seconds: 10
  call_timeout_seconds: 30
  max_retries: 1
  health_cache_seconds: 60
  save_history: true
  max_history_items: 100
  redact_sensitive_values: true

release_readiness:
  enabled: true
  validation_only: true
  require_all_blocking_gates: true
  allow_tag_creation: false
  allow_release_creation: false
  allow_deployment: false
  require_clean_repository: true
  require_origin_match: true
  require_vercel_status_only: true
  max_gates: 50
  max_output_chars: 8000

execution:
  enabled: true
  default_mode: plan_only
  local_first: true
  allow_file_writes: true
  allow_command_execution: true
  allow_git_writes: true
  allow_browser_read: true
  allow_browser_actions: false
  allow_notifications: true
  allow_scheduler_runner: true
  allow_communication_send: false
  allow_mcp_execution: false
  allow_model_runtime_start: false
  allow_external_network: false
  allow_background_execution: false
  allow_secrets_access: false
  allow_credentials_access: false
  require_approval_for_side_effects: true
  block_critical_actions: true

approvals:
  enabled: true
  default_mode: explicit_only
  require_explicit_approval: true
  allow_implied_approval: false
  allow_broad_approval: false
  allow_permanent_approval: false
  allow_secret_access_approval: false
  allow_critical_action_approval: false
  default_ttl_seconds: 900
  require_resource_scope: true
  require_permission_scope: true

broker:
  enabled: true
  default_mode: dry_run
  allow_actual_execution: true
  allow_unapproved_execution: false
  require_policy_check: true
  require_approval_for_side_effects: true
  require_permission_scope: true
  allow_external_tools: false
  allow_network_tools: false
  allow_background_tools: false
  block_critical_actions: true
  store_payloads: false
